server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    keepalive_timeout 120s;
    keepalive_requests 10000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}